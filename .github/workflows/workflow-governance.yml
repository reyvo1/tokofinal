name: Workflow Governance

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install validator dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/workflow.mjs validate
      - run: node scripts/validate-repo.mjs

  pull-request-policy:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate branch, title, and PR template
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node scripts/validate-pr-policy.mjs
