          T360_CI_STEP_RUNTIME_ARTIFACT_UPLOAD: ${{ steps.upload_runtime.outcome }}
        run: npm run ci:summary:github

      - name: Upload all simulation evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toko360-full-system-evidence-${{ github.sha }}
          path: |
            handoff/quality/*.json
            handoff/quality/security-dependency-proposal/**
            logs/**
            work-items/generated/T360-20260802-145524/evidence/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Assert aggregate GitHub simulation result
        if: always()
        run: npm run ci:summary:github:assert
